---
all:
  children:
    workstations:
      vars:
        ansible_ssh_port: 22
        ansible_user: "{{ lookup('env', 'USER') }}"
        zsh_user: "{{ ansible_user | default(ansible_user_id) }}"
      hosts:
        pc1:  { ansible_ssh_host : pc-salon    }
        pc2:  { ansible_ssh_host : pc-bureau    }
        pc3:  { ansible_ssh_host : pc-portable  }
